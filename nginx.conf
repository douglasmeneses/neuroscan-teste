server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security / SharedArrayBuffer headers ─────────────────────────────
    # Required by sql.js (WASM) and mirrored from metro.config.js
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"    always;

    # ── API proxy ─────────────────────────────────────────────────────────
    # Repassa todas as chamadas /api/* para o container neuroscan-api.
    # Dentro da rede Docker o hostname é o nome do container.
    # O prefixo /api é removido antes de encaminhar.
    location /api/ {
        proxy_pass         http://neuroscan-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA routing ──────────────────────────────────────────────────────
    # Expo Router generates an index.html per route for static export.
    # This fallback handles any path that doesn't match a real file.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────
    # JS/CSS/fonts/images/wasm are content-hashed by Metro → safe to cache
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeat COEP/COOP: location-level add_header overrides server-level
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}
